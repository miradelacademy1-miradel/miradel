name: 1) APK imzo kaliti yaratish (bir marta)

# Faqat BIR MARTA ishga tushiring. Natija: "keystore-yashirin" artifact (1 kun saqlanadi).
# Undagi 4 ta qiymatni GitHub Secrets ga qoʻying, keyin artifactni oʻchiring.
# Kalitni YOʻQOTSANGIZ, mavjud oʻquvchilar ilovani yangilay olmaydi (oʻchirib qayta oʻrnatish kerak boʻladi).
on:
  workflow_dispatch: {}

jobs:
  make-key:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - name: Kalit yaratish
        run: |
          set -e
          PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore miradel.jks -alias miradel -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Miradel Academy, O=Miradel, C=UZ" 2>/dev/null
          {
            echo "ANDROID_KEYSTORE_B64=$(base64 -w0 miradel.jks)"
            echo "KEYSTORE_PASSWORD=$PASS"
            echo "KEY_ALIAS=miradel"
            echo "KEY_PASSWORD=$PASS"
          } > kalit-malumotlari.txt
          mkdir out && mv kalit-malumotlari.txt miradel.jks out/
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-yashirin
          path: out/
          retention-days: 1
