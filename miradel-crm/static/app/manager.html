<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2b2e33">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<script src="config.js"></script>
<title>Miradel — menejer</title>
<style>

:root{--bg:#d9dadb;--card:#eceded;--ink:#1d1f22;--mute:#6a6e73;--line:#c5c7c9;--acc:#2b2e33;--accink:#f1f2f2;--ok:#2f9e5b;--bad:#d6453d;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141618;--card:#1f2225;--ink:#eceeef;--mute:#9a9fa4;--line:#33373b;--acc:#e3e5e6;--accink:#17191b}}
:root[data-theme="dark"]{--bg:#141618;--card:#1f2225;--ink:#eceeef;--mute:#9a9fa4;--line:#33373b;--acc:#e3e5e6;--accink:#17191b}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 Onest,system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;justify-content:center}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#app{width:100%;max-width:430px;height:100%;display:flex;flex-direction:column;position:relative}
header{display:flex;gap:10px;align-items:center;padding:12px 14px 8px}
.logo{width:44px;height:44px;border-radius:50%;background:var(--acc);color:var(--accink);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.who{flex:1;background:var(--card);border-radius:22px;padding:6px 14px;min-width:0}
.who b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:12.5px;color:var(--mute)}
main{flex:1;overflow-y:auto;padding:4px 14px 18px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.pg{display:none}.pg.on{display:block}
h2{font-size:13px;font-weight:600;color:var(--mute);margin:18px 2px 8px}
.card{background:var(--card);border-radius:18px;padding:14px}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.sl{flex:0 0 100%;scroll-snap-align:center;border-radius:18px;padding:18px;min-height:132px;background:var(--acc);color:var(--accink)}
.sl b{font-size:19px;font-weight:800;display:block;line-height:1.2;margin-bottom:6px}
.sl span{opacity:.8;font-size:13.5px}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink)}
.note{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.note:last-child{border:0}
.pip{width:8px;height:8px;border-radius:50%;background:var(--bad);margin-top:6px;flex:none}.pip.g{background:var(--ok)}.pip.m{background:var(--mute)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.cal span{aspect-ratio:1;display:grid;place-items:center;border-radius:50%}
.cal .h{color:var(--mute);aspect-ratio:auto;font-size:11px}
.cal .ls{background:var(--line);font-weight:600}.cal .td{background:var(--acc);color:var(--accink);font-weight:800}
.task{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.task:last-child{border:0}
.ck{width:24px;height:24px;border-radius:8px;border:2px solid var(--mute);flex:none;display:grid;place-items:center;font-size:14px;color:transparent}
.task.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.task.done .t{text-decoration:line-through;color:var(--mute)}
.t{flex:1}.t small{display:block;color:var(--mute);font-size:12px}
.pts{font-weight:600;font-size:13px}
.seg{display:flex;background:var(--line);border-radius:14px;padding:3px;margin:4px 0 12px}
.seg button{flex:1;padding:7px 4px;border-radius:11px;font-size:13.5px;font-weight:500;color:var(--mute)}
.seg button.on{background:var(--card);color:var(--ink);font-weight:600}
.soon{border:1.5px dashed var(--line);border-radius:18px;padding:16px;text-align:center;color:var(--mute)}
.soon b{color:var(--ink);display:block}
.dash{background:#181b24;color:#fff;border-radius:28px;padding:16px 14px 14px;box-shadow:0 14px 30px rgba(0,0,0,.25)}
.dh{display:flex;gap:10px;align-items:center;padding:0 2px}
.di{width:40px;height:40px;border-radius:12px;background:#212530;display:grid;place-items:center;color:#8a90a0;font-size:18px}
.dh small{display:block;color:#8a90a0;font-size:12px;line-height:1.2}.dh b{font-weight:600}
.dseg{display:flex;border:1px solid #2a2e39;border-radius:22px;padding:3px;background:#14161d;margin-top:2px}
.dseg button{flex:1;padding:9px 6px;border-radius:19px;color:#8a90a0;font-size:13.5px}
.dseg button.on{background:#272b37;color:#fff;font-weight:600;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.dseg button:focus-visible{outline-color:#fff}
@media (prefers-reduced-motion:no-preference){.glow{animation:pls 2s ease-in-out infinite}@keyframes pls{50%{opacity:.8}}}
.lr{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.lr:last-child{border:0}.lr .n{width:22px;color:var(--mute);font-weight:600}.lr .nm{flex:1}.lr.me{font-weight:700}
.lr .av{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;font-weight:600}
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.art{background:var(--card);border-radius:16px;padding:12px 6px;text-align:center;font-size:12px}
.art .ic{font-size:30px;line-height:1.2}
.art.lock{opacity:.45}
.q{display:flex;gap:10px;align-items:center;margin-top:10px}.q .t b{font-weight:600}
.chat{display:flex;flex-direction:column;height:100%}
.msgs{flex:1;display:flex;flex-direction:column;gap:6px;padding:4px 0}
.m{max-width:80%;padding:8px 12px;border-radius:16px;background:var(--card);align-self:flex-start;font-size:14px}
.m.me{align-self:flex-end;background:var(--acc);color:var(--accink)}
.m small{display:block;font-size:11px;opacity:.65}
.send{display:flex;gap:8px;margin-top:8px}
.send input{flex:1;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:10px 14px;font:inherit;min-width:0}
.send button{background:var(--acc);color:var(--accink);border-radius:20px;padding:0 16px;font-weight:600}
.big{font-size:30px;font-weight:800}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}
nav{display:flex;justify-content:space-around;margin:0 12px 10px;background:var(--card);border-radius:26px;padding:6px}
nav button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 8px;border-radius:18px;min-width:62px;font-size:11px;color:var(--mute)}
nav button b{font-size:19px;line-height:1.2;font-weight:400}
nav button.on{background:var(--acc);color:var(--accink)}
@media (prefers-reduced-motion:no-preference){.needle{transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.pg.on>*{animation:pop .6s cubic-bezier(.34,1.56,.64,1) both;animation-delay:calc(var(--i,0)*75ms)}
@keyframes pop{from{opacity:0;transform:translateY(22px) scale(.93)}to{opacity:1;transform:none}}}
.logo{cursor:pointer}
/* Tungi mavzu: toʻq koʻk + neon */
html:root[data-skin="night"]{--bg:#080d2b;--card:#111a4a;--ink:#e8ecff;--mute:#8d99dc;--line:#232e72;--acc:#18f0d4;--accink:#031026;--ok:#2cff9b;--bad:#ff3b82}
html:root[data-skin="night"] body{background:radial-gradient(120% 60% at 15% 0%,rgba(52,96,255,.32),transparent 60%),radial-gradient(90% 50% at 100% 100%,rgba(190,60,255,.22),transparent 60%),#080d2b}
html:root[data-skin="night"] :is(.card,.who,.art,.soon,nav){border:1px solid rgba(86,120,255,.32);box-shadow:0 0 16px rgba(50,90,255,.18)}
html:root[data-skin="night"] .logo{box-shadow:0 0 16px rgba(24,240,212,.7)}
html:root[data-skin="night"] .sl{background:linear-gradient(135deg,#1c2fa8,#6a2bdc);color:#fff;box-shadow:0 0 24px rgba(90,70,255,.5)}
html:root[data-skin="night"] nav button.on{box-shadow:0 0 16px rgba(24,240,212,.65)}
html:root[data-skin="night"] .seg button.on{box-shadow:0 0 10px rgba(24,240,212,.35);color:#18f0d4}
html:root[data-skin="night"] .task.done .ck{box-shadow:0 0 10px rgba(44,255,155,.7)}
html:root[data-skin="night"] .dash{background:#0a1038;border:1px solid rgba(24,240,212,.45);box-shadow:0 0 32px rgba(24,240,212,.28)}
html:root[data-skin="night"] #gauge path:not(.glow){stroke:#1a2466}
/* Miradel mavzusi: shisha (glass) */
html:root[data-skin="glass"]{--bg:#9da2a8;--card:rgba(255,255,255,.28);--ink:#101318;--mute:#3a4048;--line:rgba(255,255,255,.5);--acc:rgba(24,27,33,.8);--accink:#fff;--ok:#1f9d55;--bad:#d23a32}
html:root[data-skin="glass"] body{background:linear-gradient(145deg,#c9ccd0 0%,#8b9097 50%,#5f656d 100%) fixed}
html:root[data-skin="glass"] body::before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(40% 30% at 15% 15%,rgba(255,255,255,.75),transparent 70%),radial-gradient(35% 30% at 90% 40%,rgba(120,130,150,.55),transparent 70%),radial-gradient(45% 35% at 30% 95%,rgba(20,24,30,.55),transparent 70%)}
html:root[data-skin="glass"] :is(.card,.who,.art,.soon,.seg,.m,.send input,nav),html:root[data-skin="glass"] .av{background:var(--card);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid rgba(255,255,255,.6);box-shadow:0 8px 26px rgba(20,24,30,.18),inset 0 1px 0 rgba(255,255,255,.7)}
html:root[data-skin="glass"] .logo{background:rgba(24,27,33,.72);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.5);box-shadow:0 6px 18px rgba(20,24,30,.25),inset 0 1px 0 rgba(255,255,255,.4)}
html:root[data-skin="glass"] .m.me{background:var(--acc);color:#fff}
html:root[data-skin="glass"] .sl{background:linear-gradient(135deg,rgba(25,28,34,.78),rgba(70,78,92,.55));color:#fff;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.35);box-shadow:0 10px 28px rgba(20,24,30,.28),inset 0 1px 0 rgba(255,255,255,.4)}
html:root[data-skin="glass"] .dash{background:rgba(22,26,34,.5);-webkit-backdrop-filter:blur(22px) saturate(1.6);backdrop-filter:blur(22px) saturate(1.6);border:1px solid rgba(255,255,255,.4);box-shadow:0 14px 34px rgba(10,12,16,.3),inset 0 1px 0 rgba(255,255,255,.45)}
html:root[data-skin="glass"] .dseg{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.28)}
html:root[data-skin="glass"] .dseg button.on{background:rgba(255,255,255,.22)}
html:root[data-skin="glass"] .di{background:rgba(255,255,255,.14)}
html:root[data-skin="glass"] #gauge path:not(.glow){stroke:rgba(255,255,255,.2)}
html:root[data-skin="glass"] #gauge rect{fill:rgba(255,255,255,.15)}

[hidden]{display:none!important}
.net{font-size:12px;color:var(--bad);font-weight:600;white-space:nowrap}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--mute);margin-bottom:10px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.btn{display:block;width:100%;background:var(--acc);color:var(--accink);border-radius:14px;padding:12px;font-weight:600}
.btn.g{background:var(--line);color:var(--ink)}
.btn.sm{width:auto;padding:6px 12px;font-size:13px;border-radius:10px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{color:var(--mute);padding:6px 0}
.sub{color:var(--mute);font-size:13px;margin:0 0 8px}
.cnt{display:flex;gap:8px;margin:8px 0 0}.cnt div{flex:1;background:var(--bg);border-radius:14px;padding:8px 4px;text-align:center;font-size:12px;color:var(--mute)}.cnt b{display:block;font-size:15px;color:var(--ink);white-space:nowrap}
.ar{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}.ar:last-child{border:0}.ar .nm{flex:1;min-width:0}.ar .nm small{display:block;color:var(--mute);font-size:12px}
.chip{display:inline-block;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;border:1.5px solid currentColor;white-space:nowrap}
.c-ok{color:var(--ok)}.c-bad{color:var(--bad)}.c-warn{color:#c98a1b}.c-mute{color:var(--mute)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.kv span:first-child{color:var(--mute)}
.search{margin-bottom:10px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;z-index:20}
.sheet{background:var(--bg);color:var(--ink);width:100%;max-width:430px;max-height:90%;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet h3{margin:0 0 2px;font-size:18px}.sheet h4{margin:14px 0 6px;font-size:13px;color:var(--mute);font-weight:600}
.sheet .meta{color:var(--mute);font-size:13px}
.off{opacity:.5}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--acc);color:var(--accink);padding:10px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;z-index:30;text-align:center}
#toast.on{opacity:1}
.sw{background:var(--line);color:var(--ink);border-radius:14px;padding:6px 10px;font-size:12.5px;font-weight:600;white-space:nowrap}
</style>
</head>
<body>
<div id="app">
<header><div class="logo" role="button" title="Mavzuni almashtirish" aria-label="Mavzuni almashtirish">M</div><div class="who"><b id="wn"></b><span>Menejer</span></div><span class="net" id="net" hidden></span><button class="sw" id="swp" hidden>Oʻqituvchi ›</button></header>
<main>
 <section class="pg on" id="p-fin">
  <div class="card"><label style="margin:0">Oy<input id="fm" type="month"></label><div class="cnt" id="ftot"></div></div>
  <div class="seg" id="fseg" style="margin-top:12px"><button class="on" data-k="all">Hammasi</button><button data-k="debt">Qarzdor</button><button data-k="paid">Toʻlagan</button></div>
  <input class="search" id="fq" placeholder="Qidirish: ism yoki guruh" aria-label="Qidirish">
  <div class="card" id="flist"></div>
  <h2>Guruh narxlari (oyiga)</h2><div class="card" id="gfees"></div>
 </section>

 <section class="pg" id="p-sal">
  <div class="card"><label style="margin:0">Oy<input id="sm" type="month"></label><div class="cnt" id="stot"></div></div>
  <h2>Oʻqituvchilar</h2><div class="card" id="slist"></div>
 </section>

 <section class="pg" id="p-plan">
  <div class="card">
   <label>Oʻqituvchi<select id="pt"></select></label>
   <label>Vazifa<input id="pn" maxlength="200" placeholder="Masalan: Unit 5 testini oʻtkazish"></label>
   <label>Muddat (ixtiyoriy)<input id="pd" type="date"></label>
   <button class="btn" id="padd">Belgilash</button>
  </div>
  <div class="seg" id="pseg" style="margin-top:12px"><button class="on" data-k="">Hammasi</button><button data-k="todo">Bajarilmagan</button><button data-k="done">Bajarilgan</button></div>
  <div class="card" id="plist"></div>
 </section>

 <section class="pg" id="p-rep"><h2 style="margin-top:6px">Oʻqituvchilar dars hisobotlari</h2><div class="card" id="rlist"></div></section>

 <section class="pg" id="p-prof">
  <div class="card" id="pinfo"></div>
  <h2>Parolni oʻzgartirish</h2>
  <div class="card"><label>Hozirgi parol<input id="opw" type="password" autocomplete="current-password"></label><label>Yangi parol (kamida 6 belgi)<input id="npw" type="password" autocomplete="new-password"></label><button class="btn" id="chpw">Oʻzgartirish</button></div>
  <h2>Mavzu</h2><div class="seg" id="skins"><button class="on" data-s="classic">Oq-qora</button><button data-s="night">Tungi</button><button data-s="glass">Miradel</button></div>
  <a class="btn g" id="adm" href="/admin/" hidden style="margin-top:14px;text-align:center;text-decoration:none">Admin paneli</a>
  <button class="btn g" id="out" style="margin-top:12px">Chiqish</button>
 </section>
</main>
<nav id="nav">
 <button class="on" data-p="fin"><b>◈</b>Moliya</button>
 <button data-p="sal"><b>☰</b>Maosh</button>
 <button data-p="plan"><b>▦</b>Reja</button>
 <button data-p="rep"><b>▤</b>Hisobot</button>
 <button data-p="prof"><b>◉</b>Profil</button>
</nav>
</div>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div id="toast" role="status"></div>
<script>
(function(){
var TOKEN=localStorage.getItem("at")||"",au=null;try{au=JSON.parse(localStorage.getItem("au"))}catch(e){}
if(!TOKEN||!au||(au.panels.indexOf("manager")<0&&au.panels.indexOf("admin")<0)){location.replace("index.html");return}
localStorage.setItem("lastpanel","manager");
var $=function(s,r){return (r||document).querySelector(s)},$$=function(s,r){return Array.from((r||document).querySelectorAll(s))};
function esc(s){var d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML}
function fmt(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g," ")+" soʻm"}
function toast(t){var e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.x);toast.x=setTimeout(function(){e.classList.remove("on")},2800)}
function mnow(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()<9?"0":"")+(d.getMonth()+1)}
function api(p,o){o=o||{};var h={"Content-Type":"application/json"};if(TOKEN)h.Authorization="Bearer "+TOKEN;
 return fetch((window.API_BASE||"")+"/api"+p,{method:o.method||"GET",headers:h,body:o.body?JSON.stringify(o.body):undefined}).catch(function(){var e=new Error("Internet kerak");e.offline=true;throw e}).then(function(r){return r.json().catch(function(){return null}).then(function(d){if(!r.ok){var e=new Error(d&&typeof d.detail==="string"?d.detail:(r.status===422?"Maʼlumot notoʻgʻri":"Xatolik "+r.status));e.status=r.status;throw e}return d})})}
function fail(e){if(e.status===401||e.status===403){logout();return}toast(e.offline?"Bu boʻlim uchun internet kerak":e.message)}
function logout(){TOKEN="";localStorage.removeItem("at");localStorage.removeItem("au");localStorage.removeItem("lastpanel");Promise.all(["t_snap","t_queue","t_user","snap","queue","snapuser"].map(function(k){return idbSet(k,null)})).then(function(){location.replace("index.html")})}
var DB=null;function idbSet(k,v){return new Promise(function(res){var r=indexedDB.open("miradel",1);r.onupgradeneeded=function(){r.result.createObjectStore("kv")};r.onsuccess=function(){var t=r.result.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=res;t.onerror=res};r.onerror=res})}
$("#out").onclick=logout;
function net(){var n=$("#net");n.hidden=navigator.onLine;n.textContent="Oflayn"}
window.addEventListener("online",function(){net();load()});window.addEventListener("offline",net);
var page="fin",F=null,fk="all",pk="",SAL=null,PL=[];
var ST={paid:["Toʻlangan","c-ok"],partial:["Qisman","c-warn"],partial_late:["Qisman · kechikkan","c-bad"],unpaid:["Kutilmoqda","c-mute"],overdue:["Qarz","c-bad"],nofee:["Narx yoʻq","c-mute"]};
var MODE={per_lesson:"Dars soni × stavka",percent:"Tushumdan foiz",fixed:"Qatʼiy oylik"};
function closeM(){$("#ov").hidden=true}$("#ov").onclick=function(e){if(e.target===$("#ov"))closeM()};document.addEventListener("keydown",function(e){if(e.key==="Escape")closeM()});
function openSheet(h){$("#sheet").innerHTML=h;$("#ov").hidden=false}
// ---------- Moliya ----------
function loadFin(){return api("/manager/finance?month="+$("#fm").value).then(function(d){F=d;drawFin()}).catch(fail)}
function drawFin(){if(!F)return;var t=F.totals;
 $("#ftot").innerHTML="<div><b>"+fmt(t.collected)+"</b>Tushum</div><div><b>"+fmt(t.expected)+"</b>Kutilgan</div><div><b>"+t.debtors+"</b>Qarzdor</div>";
